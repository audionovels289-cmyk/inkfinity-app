name: Build Android Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Create simple settings.gradle
        run: |
          echo "include ':app'" > settings.gradle
          echo "rootProject.name = 'inkfinity-app'" >> settings.gradle

      - name: Inject Repositories into build.gradle
        run: |
          if [ -f app/build.gradle ]; then
            # Prepend buildscript repositories so older gradle can find android plugins
            sed -i '1i buildscript { repositories { google(); mavenCentral() } }' app/build.gradle
          fi

      - name: Build Android App Bundle (AAB)
        run: gradle bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/app-release.aab
